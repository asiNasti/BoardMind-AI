name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: boardmind
          POSTGRES_PASSWORD: boardmind
          POSTGRES_DB: boardmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://boardmind:boardmind@localhost:5432/boardmind
      GEMINI_API_KEY: fake_key_for_ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest-cov ruff black mypy

    - name: Check code formatting and linting
      run: |
        black --check backend/
        ruff check backend/
        cd backend && mypy app

    - name: Run Alembic migrations
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests with pytest
      run: |
        cd backend
        pytest --cov=app --cov-report=term-missing --cov-fail-under=80
  
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Run ESLint
      run: |
        cd frontend
        npx eslint "src/**/*.{js,jsx}" --max-warnings 0