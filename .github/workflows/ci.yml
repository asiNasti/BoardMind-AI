name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: boardmind
          POSTGRES_PASSWORD: boardmind
          POSTGRES_DB: boardmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://boardmind:boardmind@localhost:5432/boardmind
      GEMINI_API_KEY: fake_key_for_ci

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest-cov ruff black

    - name: Check code formatting and linting
      run: |
        black --check backend/
        ruff check backend/

    - name: Run Alembic migrations
      run: |
        cd backend
        alembic upgrade head

    - name: Run tests with pytest
      run: |
        cd backend
        pytest --cov=app --cov-report=term-missing --cov-fail-under=80