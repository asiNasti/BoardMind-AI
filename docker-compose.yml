services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boardmind}
      POSTGRES_USER: ${POSTGRES_USER:-boardmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://boardmind:boardmind@db:5432/boardmind}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: